# This workflow will install Python dependencies, run pylint and mypy with a single version of Python
name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint source code with Pylint
      run: |
        pylint src
    - name: Check typing with mypy
      run: |
        mypy src
    - name: Check formating with Black
      run: |
        black --check src
    - name: Check tests code with pylint
      run: |
        mypy tests
    - name: Check tests code with mypy
      run: |
        mypy tests
    - name: Check tests with Black
      run: |
        black --check tests

