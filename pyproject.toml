[project]
name = "alert-tray-icon"
version = "0.1.0"
description = "Alert Tray Icon App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pystray>=0.19.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pystray.*"]
ignore_missing_imports = true